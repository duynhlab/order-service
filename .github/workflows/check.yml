name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  pr-checks:
    uses: duynhlab/gha-workflows/.github/workflows/pr-checks.yml@b271f01094ee7f16271b14575539e62907a50724 # v1.0.0
    with:
      slack_channel_id: "C0AD82A9A74"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  go-check:
    uses: duynhlab/gha-workflows/.github/workflows/go-check.yml@6b1c155968c3212b10f0415a07e6e8e3cf04d5a9 # v1.0.1
    with:
      command-test: 'go test -race -coverprofile=coverage.out ./...'
      lint: true
      integration: true
      integration-command: 'go test -v -tags=integration -covermode=atomic -coverprofile=coverage-integration.out ./internal/core/repository/...'

  gitleaks:
    uses: duynhlab/gha-workflows/.github/workflows/gitleaks.yml@b271f01094ee7f16271b14575539e62907a50724 # v1.0.0
    permissions:
      contents: read
      security-events: write

  sonar:
    needs: [go-check, gitleaks]
    uses: duynhlab/gha-workflows/.github/workflows/sonarqube.yml@b271f01094ee7f16271b14575539e62907a50724 # v1.0.0
    with:
      project-key: 'duynhlab_${{ github.event.repository.name }}'
      organization: 'duynhlab'
      fail-on-quality-gate: false
      integration-coverage: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  notify:
    # Dependabot PRs run without repo secrets, so the Slack call can only
    # fail there — skip instead of painting every deps PR red.
    if: always() && github.actor != 'dependabot[bot]'
    needs: [pr-checks, go-check, gitleaks, sonar]
    uses: duynhlab/gha-workflows/.github/workflows/status.yml@b271f01094ee7f16271b14575539e62907a50724 # v1.0.0
    with:
      slack_channel_id: "C0AD82A9A74"
      slack_thread_ts: ${{ needs.pr-checks.outputs.slack_thread_ts }}
      gsheet_spreadsheet_id: "1F2VUrAOyMGnETApp5yA-ldCW81ConiQXnWYZVxKas_0"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
      GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
